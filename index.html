<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZS Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }
        .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .animate-fade-up { animation: fadeUp 0.5s ease-out forwards; }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        .gatekeeper-active { overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col gatekeeper-active">

    <!-- Gatekeeper Overlay -->
    <div id="gatekeeper" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center transition-all duration-700">
        <div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(#facc15 1px, transparent 1px); background-size: 20px 20px;"></div>
        <div class="max-w-md w-full px-8 text-center animate-fade-up">
            <div class="w-16 h-16 bg-yellow-400 rounded-2xl flex items-center justify-center text-slate-950 font-black text-xl shadow-2xl mx-auto mb-8 shadow-yellow-400/20">MZS</div>
            <h2 class="text-white text-xs font-black uppercase tracking-[0.4em] mb-2">Security Verification</h2>
            <h3 class="text-slate-400 text-[10px] font-bold uppercase mb-8">Executive Suite Restricted Access</h3>
            
            <div id="auth-box" class="space-y-4">
                <input type="password" id="access-key" placeholder="Enter Access Key" class="w-full bg-slate-900 border-2 border-slate-800 rounded-2xl py-5 px-6 text-center text-white font-black tracking-widest outline-none focus:border-yellow-400 transition-all placeholder:text-slate-700 placeholder:tracking-normal placeholder:font-bold">
                <button onclick="executiveApp.verifyAccess()" id="verify-btn" class="w-full bg-yellow-400 text-slate-950 py-5 rounded-2xl font-black uppercase tracking-widest text-xs hover:bg-yellow-300 transition-all shadow-xl shadow-yellow-400/10">Authorize Access</button>
                <p id="auth-error" class="text-red-500 text-[9px] font-black uppercase tracking-widest hidden">Access Denied • Invalid Key</p>
                <p class="text-[8px] text-slate-600 mt-4 uppercase font-bold tracking-widest">Key stored in Spreadsheet: AdminConfig</p>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <header class="bg-white/80 backdrop-blur-md border-b sticky top-0 z-50">
        <div class="container mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white font-black text-sm shadow-lg shadow-slate-200">MZS</div>
                <h1 class="text-2xl font-black bg-slate-900 bg-clip-text text-transparent uppercase tracking-tighter">Executive</h1>
            </div>
            <div class="flex items-center gap-4">
                <a href="survey.html" class="hidden md:flex items-center gap-2 bg-yellow-400 hover:bg-yellow-500 text-slate-900 px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-widest transition-all shadow-md">
                    Live Survey <span class="text-lg">→</span>
                </a>
                <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200">
                    <button onclick="executiveApp.setLang('de')" id="lang-de" class="px-2 py-1 rounded text-[10px] font-black uppercase transition-all">DE</button>
                    <button onclick="executiveApp.setLang('en')" id="lang-en" class="px-2 py-1 rounded text-[10px] font-black uppercase transition-all">EN</button>
                </div>
            </div>
        </div>
    </header>

    <main id="main-content" class="flex-grow">
        <!-- Hero Section -->
        <section class="hero-gradient text-white py-20 px-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-1/3 h-full bg-yellow-400/5 skew-x-12 transform translate-x-1/2"></div>
            <div class="container mx-auto max-w-6xl relative z-10 animate-fade-up">
                <span id="hero-subtitle" class="text-yellow-400 text-xs font-black uppercase tracking-[0.4em] mb-4 block">Operations Intelligence Portal</span>
                <h2 id="hero-title" class="text-5xl md:text-7xl font-black uppercase tracking-tighter leading-none mb-8">Building Better<br>Through Feedback.</h2>
                
                <div class="flex flex-wrap gap-12 mt-12">
                    <div class="flex flex-col">
                        <span id="stat-total" class="text-5xl font-black text-white">0</span>
                        <span class="text-[10px] font-black uppercase text-slate-400 tracking-widest mt-2">Total Submissions</span>
                    </div>
                    <div class="flex flex-col">
                        <span id="stat-avg" class="text-5xl font-black text-yellow-400">0%</span>
                        <span class="text-[10px] font-black uppercase text-slate-400 tracking-widest mt-2">Team Satisfaction</span>
                    </div>
                    <div class="flex flex-col">
                        <span id="stat-active" class="text-5xl font-black text-emerald-400">0</span>
                        <span class="text-[10px] font-black uppercase text-slate-400 tracking-widest mt-2">Active Metrics</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Dashboard Content -->
        <div class="container mx-auto px-6 -mt-10 pb-20 max-w-6xl">
            <div id="view-container" class="space-y-8 animate-fade-up">
                <!-- Content injected via JS -->
            </div>
        </div>
    </main>

    <footer class="bg-white border-t py-10 text-center">
        <p id="footer-text" class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em]"></p>
    </footer>

    <script>
        const APPSCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxTvoifj1hblrg8zjjDLJGw1USPngqBB2kcJNVH3D7hue_yXRDkg6xQTfhdB5UHTL_p/exec';
        
        const translations = {
            de: {
                heroSubtitle: 'Betriebs-Intelligenz Portal',
                heroTitle: 'Besser Bauen<br>durch Feedback.',
                totalSubmissions: 'Gesamteinträge',
                teamSatisfaction: 'Team-Zufriedenheit',
                activeMetrics: 'Aktive Metriken',
                footer: '© 2026 MZS - Bau & Zimmerei Division | Sicher & Robust',
                months: ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'],
                shortMonths: ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'],
                fullYear: 'Ganzes Jahr',
                refresh: 'Aktualisieren',
                performanceOverTime: 'Leistung im Zeitverlauf',
                fieldIntelligence: 'Feld-Informationen',
                noActiveComments: 'Keine Kommentare vorhanden',
                metricInfra: 'Metrik-Management',
                addMetric: 'Neue Metrik',
                modifyMetric: 'Metrik anpassen',
                questionText: 'Anzeigetext',
                metricType: 'Typ',
                scheduleType: 'Zeitplan',
                recurring: 'Wiederkehrend',
                oneOff: 'Einmalig',
                activeYears: 'Jahre',
                activeMonths: 'Monate',
                deployMetric: 'Aktivieren',
                updateMetric: 'Aktualisieren',
                hideMetric: 'Ausblenden',
                cancel: 'Abbrechen',
                systemCatalog: 'System-Katalog'
            },
            en: {
                heroSubtitle: 'Operations Intelligence Portal',
                heroTitle: 'Building Better<br>Through Feedback.',
                totalSubmissions: 'Total Submissions',
                teamSatisfaction: 'Team Satisfaction',
                activeMetrics: 'Active Metrics',
                footer: '&copy; 2026 MZS - Roofing & Carpentry | Secure & Robust',
                months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
                shortMonths: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                fullYear: 'Full Year',
                refresh: 'Refresh',
                performanceOverTime: 'Performance Over Time',
                fieldIntelligence: 'Field Intelligence',
                noActiveComments: 'No active comments to display',
                metricInfra: 'Metric Management',
                addMetric: 'Add New Metric',
                modifyMetric: 'Modify Metric',
                questionText: 'Display Text',
                metricType: 'Type',
                scheduleType: 'Schedule',
                recurring: 'Recurring',
                oneOff: 'One-Off',
                activeYears: 'Years',
                activeMonths: 'Months',
                deployMetric: 'Deploy',
                updateMetric: 'Update',
                hideMetric: 'Hide',
                cancel: 'Cancel',
                systemCatalog: 'System Catalog'
            }
        };

        const QuestionType = {
            SATISFACTION_SCALE: 'SATISFACTION_SCALE',
            PERFORMANCE_RATING: 'PERFORMANCE_RATING',
            TEXT_FEEDBACK: 'TEXT_FEEDBACK'
        };

        const executiveApp = {
            lang: localStorage.getItem('app_lang') || 'de',
            isSyncing: false,
            isAuthenticated: sessionStorage.getItem('mzs_unlocked') === 'true',
            questions: [],
            responses: [],
            selectedMonth: 'All',
            selectedYear: new Date().getFullYear().toString(),
            editingQuestionId: null,

            init() {
                this.loadQuestions();
                this.updateUI();
                if (this.isAuthenticated) {
                    this.unlockDashboard();
                }
            },

            async verifyAccess() {
                const key = document.getElementById('access-key').value;
                const btn = document.getElementById('verify-btn');
                const error = document.getElementById('auth-error');
                const authBox = document.getElementById('auth-box');
                if (!key) return;
                btn.disabled = true;
                btn.textContent = 'Verifying...';
                error.classList.add('hidden');
                authBox.classList.remove('animate-shake');
                try {
                    const checkResp = await fetch(`${APPSCRIPT_URL}?action=verify_key&key=${encodeURIComponent(key)}`);
                    const result = await checkResp.json();
                    if (result.success) {
                        sessionStorage.setItem('mzs_unlocked', 'true');
                        this.isAuthenticated = true;
                        this.unlockDashboard();
                    } else { throw new Error('Invalid'); }
                } catch (e) {
                    btn.disabled = false;
                    btn.textContent = 'Authorize Access';
                    error.classList.remove('hidden');
                    authBox.classList.add('animate-shake');
                    document.getElementById('access-key').value = '';
                }
            },

            unlockDashboard() {
                const gatekeeper = document.getElementById('gatekeeper');
                gatekeeper.style.transform = 'translateY(-100%)';
                gatekeeper.style.opacity = '0';
                document.body.classList.remove('gatekeeper-active');
                setTimeout(() => {
                    gatekeeper.style.display = 'none';
                    this.fetchCloudData();
                }, 700);
            },

            loadQuestions() {
                const raw = localStorage.getItem('survey_questions');
                if (raw) { this.questions = JSON.parse(raw); }
            },

            saveQuestions() {
                localStorage.setItem('survey_questions', JSON.stringify(this.questions));
            },

            setLang(lang) {
                this.lang = lang;
                localStorage.setItem('app_lang', lang);
                this.updateUI();
            },

            updateUI() {
                const t = translations[this.lang];
                if (document.getElementById('hero-subtitle')) document.getElementById('hero-subtitle').textContent = t.heroSubtitle;
                if (document.getElementById('hero-title')) document.getElementById('hero-title').innerHTML = t.heroTitle;
                if (document.getElementById('footer-text')) document.getElementById('footer-text').innerHTML = t.footer;
                if (document.getElementById('lang-de')) document.getElementById('lang-de').className = `px-2 py-1 rounded text-[10px] font-black uppercase transition-all ${this.lang === 'de' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`;
                if (document.getElementById('lang-en')) document.getElementById('lang-en').className = `px-2 py-1 rounded text-[10px] font-black uppercase transition-all ${this.lang === 'en' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`;
                this.renderDashboard();
                this.updateHeroStats();
            },

            updateHeroStats() {
                const t = translations[this.lang];
                const filtered = this.responses.filter(r => {
                    const matchesMonth = this.selectedMonth === 'All' || r.monthIndex === this.normalizeMonth(this.selectedMonth);
                    const matchesYear = r.year === this.selectedYear;
                    return matchesMonth && matchesYear;
                });
                if (document.getElementById('stat-total')) document.getElementById('stat-total').textContent = filtered.length;
                if (document.getElementById('stat-active')) document.getElementById('stat-active').textContent = this.questions.filter(q => !q.hidden).length;
                let score = 0, count = 0;
                filtered.forEach(r => {
                    r.answers.forEach(a => {
                        const q = this.questions.find(que => que.id === a.questionId);
                        if (q && q.type !== QuestionType.TEXT_FEEDBACK) {
                            const val = parseFloat(a.value);
                            if (!isNaN(val)) {
                                const max = q.type === QuestionType.SATISFACTION_SCALE ? 5 : 10;
                                score += (val / max) * 100;
                                count++;
                            }
                        }
                    });
                });
                const avg = count > 0 ? Math.round(score / count) : 0;
                if (document.getElementById('stat-avg')) document.getElementById('stat-avg').textContent = avg + '%';
            },

            normalizeMonth(monthName) {
                const de = translations.de.months;
                const en = translations.en.months;
                let idx = de.indexOf(monthName);
                if (idx === -1) idx = en.indexOf(monthName);
                return idx;
            },

            renderDashboard() {
                const container = document.getElementById('view-container');
                if (!container) return;
                const t = translations[this.lang];
                const filtered = this.responses.filter(r => {
                    const matchesMonth = this.selectedMonth === 'All' || r.monthIndex === this.normalizeMonth(this.selectedMonth);
                    const matchesYear = r.year === this.selectedYear;
                    return matchesMonth && matchesYear;
                });

                container.innerHTML = `
                    <div class="space-y-8">
                        <div class="flex flex-wrap gap-4 justify-end">
                            <select onchange="executiveApp.selectedMonth = this.value; executiveApp.updateUI();" class="bg-white px-5 py-3 rounded-xl border border-slate-200 text-xs font-black uppercase outline-none shadow-sm">
                                <option value="All" ${this.selectedMonth === 'All' ? 'selected' : ''}>${t.fullYear}</option>
                                ${t.months.map(m => `<option value="${m}" ${this.selectedMonth === m ? 'selected' : ''}>${m}</option>`).join('')}
                            </select>
                            <select onchange="executiveApp.selectedYear = this.value; executiveApp.updateUI();" class="bg-white px-5 py-3 rounded-xl border border-slate-200 text-xs font-black uppercase outline-none shadow-sm">
                                ${['2025', '2026', '2027', '2028', '2029', '2030'].map(y => `<option value="${y}" ${this.selectedYear === y ? 'selected' : ''}>${y}</option>`).join('')}
                            </select>
                            <button onclick="executiveApp.fetchCloudData()" class="bg-slate-900 text-white px-8 py-3 rounded-xl text-xs font-black uppercase shadow-xl hover:bg-slate-800 transition-all">
                                ${this.isSyncing ? '...' : t.refresh}
                            </button>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2 bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 h-[400px]">
                                <h3 class="text-xs font-black uppercase tracking-widest text-slate-900 mb-6">${t.performanceOverTime}</h3>
                                <canvas id="trendChart"></canvas>
                            </div>
                            <div class="bg-slate-900 p-8 rounded-[2.5rem] text-white flex flex-col h-[400px]">
                                <h3 class="text-xs font-black uppercase tracking-[0.2em] text-yellow-400 mb-6">${t.fieldIntelligence}</h3>
                                <div class="space-y-4 overflow-y-auto pr-2 custom-scrollbar flex-grow">
                                    ${filtered.flatMap(r => r.answers.filter(a => {
                                        const q = this.questions.find(que => que.id === a.questionId);
                                        return q && q.type === QuestionType.TEXT_FEEDBACK && a.value;
                                    }).map(a => `<div class="border-l-2 border-yellow-400 pl-4 py-1"><p class="text-[9px] font-bold text-slate-500">${t.months[r.monthIndex]} ${r.year} • ${r.employeeEmail}</p><p class="text-xs italic">"${a.value}"</p></div>`)).join('') || `<p class="text-slate-500 italic text-xs">${t.noActiveComments}</p>`}
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${this.questions.filter(q => !q.hidden).map(q => {
                                const ans = filtered.flatMap(r => r.answers.filter(a => a.questionId === q.id));
                                if (q.type === QuestionType.TEXT_FEEDBACK) return '';
                                const max = q.type === QuestionType.SATISFACTION_SCALE ? 5 : 10;
                                const scores = ans.map(a => parseFloat(a.value)).filter(v => !isNaN(v));
                                const avg = scores.length > 0 ? (scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
                                const percent = (avg / max) * 100;
                                return `
                                    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between min-h-[180px] transition-transform hover:-translate-y-1">
                                        <div class="flex justify-between items-start"><p class="text-[10px] font-black uppercase tracking-tight text-slate-900 max-w-[75%]">${q.text}</p><span class="bg-slate-50 text-[8px] font-black px-2 py-1 rounded">${scores.length}</span></div>
                                        <div>
                                            <div class="flex items-baseline gap-1 mb-2">
                                                <span class="text-3xl font-black ${percent > 75 ? 'text-emerald-500' : 'text-yellow-500'}">${avg.toFixed(1)}</span>
                                                <span class="text-slate-300 text-xs font-bold">/${max}</span>
                                            </div>
                                            <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                <div class="h-full bg-yellow-400 transition-all duration-700" style="width: ${percent}%"></div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div class="bg-white p-8 md:p-12 rounded-[2.5rem] border-2 border-slate-100 shadow-sm">
                            <div class="flex justify-between items-center mb-10">
                                <div><h3 class="text-2xl font-black text-slate-900 uppercase tracking-tighter">${t.metricInfra}</h3><p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">${t.systemCatalog}</p></div>
                                <div class="flex gap-2">
                                    <button onclick="executiveApp.syncSchema()" class="bg-slate-100 text-slate-600 px-6 py-3 rounded-xl text-[10px] font-black uppercase hover:bg-slate-200">Sync Sheets</button>
                                    <button onclick="executiveApp.editingQuestionId = 'new'; executiveApp.updateUI();" class="bg-slate-900 text-white px-8 py-3 rounded-xl text-[10px] font-black uppercase shadow-xl hover:bg-slate-800 transition-all">+ ${t.addMetric}</button>
                                </div>
                            </div>
                            ${this.editingQuestionId ? this.renderMetricForm() : ''}
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${this.questions.map(q => `
                                    <div class="p-6 rounded-2xl border-2 border-slate-50 bg-slate-50/30 flex flex-col justify-between h-[200px] transition-all hover:border-slate-200 group relative">
                                        <div>
                                            <div class="flex justify-between items-start mb-4">
                                                <span class="text-[8px] font-black px-2 py-1 rounded uppercase tracking-widest ${q.hidden ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-600'}">${q.hidden ? t.hideMetric : 'Aktiv'}</span>
                                                <span class="text-[8px] font-black px-2 py-1 bg-slate-100 text-slate-400 rounded uppercase tracking-widest">${q.isRecurring ? t.recurring : t.oneOff}</span>
                                            </div>
                                            <p class="text-xs font-black text-slate-900 leading-snug line-clamp-3">${q.text}</p>
                                        </div>
                                        <div class="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                            <button onclick="executiveApp.editingQuestionId = '${q.id}'; executiveApp.updateUI();" class="p-2 bg-white rounded-lg shadow-sm text-slate-400 hover:text-slate-900">✎</button>
                                            <button onclick="executiveApp.toggleHide('${q.id}')" class="p-2 bg-white rounded-lg shadow-sm text-slate-400 hover:text-slate-900">${q.hidden ? '👁' : '✕'}</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                this.renderTrendChart();
            },

            renderMetricForm() {
                const t = translations[this.lang];
                const q = this.questions.find(que => que.id === this.editingQuestionId) || { text: '', type: QuestionType.SATISFACTION_SCALE, isRecurring: true, activeMonths: [], activeYears: [] };
                return `
                    <div class="bg-slate-50 p-8 rounded-3xl border-2 border-slate-100 mb-10 animate-fade-up">
                        <form onsubmit="executiveApp.saveQuestionForm(event)" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-2"><label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">${t.questionText}</label><input required id="form-q-text" value="${q.text}" class="w-full px-5 py-4 rounded-xl border-2 border-white focus:border-yellow-400 outline-none font-bold" /></div>
                                <div class="space-y-2"><label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">${t.metricType}</label><select id="form-q-type" class="w-full px-5 py-4 rounded-xl border-2 border-white bg-white font-bold outline-none"><option value="${QuestionType.SATISFACTION_SCALE}" ${q.type === QuestionType.SATISFACTION_SCALE ? 'selected' : ''}>Satisfaction (1-5)</option><option value="${QuestionType.PERFORMANCE_RATING}" ${q.type === QuestionType.PERFORMANCE_RATING ? 'selected' : ''}>Performance (1-10)</option><option value="${QuestionType.TEXT_FEEDBACK}" ${q.type === QuestionType.TEXT_FEEDBACK ? 'selected' : ''}>Text Feedback</option></select></div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-2"><label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">${t.scheduleType}</label><div class="flex gap-4"><label class="flex items-center gap-2 cursor-pointer font-bold text-sm"><input type="radio" name="sched" value="rec" ${q.isRecurring !== false ? 'checked' : ''} onchange="executiveApp.toggleSched(true)" /> ${t.recurring}</label><label class="flex items-center gap-2 cursor-pointer font-bold text-sm"><input type="radio" name="sched" value="once" ${q.isRecurring === false ? 'checked' : ''} onchange="executiveApp.toggleSched(false)" /> ${t.oneOff}</label></div></div>
                                <div id="sched-options" class="grid grid-cols-2 gap-4 ${q.isRecurring !== false ? 'hidden' : ''}"><div class="space-y-2"><label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">${t.activeMonths}</label><select multiple id="form-q-months" class="w-full px-4 py-2 rounded-xl border-2 border-white bg-white font-bold text-xs h-24">${t.months.map(m => `<option value="${m}" ${q.activeMonths?.includes(m) ? 'selected' : ''}>${m}</option>`).join('')}</select></div><div class="space-y-2"><label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">${t.activeYears}</label><select multiple id="form-q-years" class="w-full px-4 py-2 rounded-xl border-2 border-white bg-white font-bold text-xs h-24">${['2025','2026','2027','2028','2029','2030'].map(y => `<option value="${y}" ${q.activeYears?.includes(y) ? 'selected' : ''}>${y}</option>`).join('')}</select></div></div>
                            </div>
                            <div class="flex gap-3 justify-end pt-4 border-t border-slate-200"><button type="button" onclick="executiveApp.editingQuestionId = null; executiveApp.updateUI();" class="px-6 py-3 rounded-xl text-[10px] font-black uppercase text-slate-400 hover:text-slate-900 transition-all">${t.cancel}</button><button type="submit" class="bg-yellow-400 text-slate-900 px-8 py-3 rounded-xl text-[10px] font-black uppercase shadow-lg">${this.editingQuestionId === 'new' ? t.deployMetric : t.updateMetric}</button></div>
                        </form>
                    </div>
                `;
            },

            toggleSched(isRec) { const el = document.getElementById('sched-options'); if(el) el.className = `grid grid-cols-2 gap-4 ${isRec ? 'hidden' : ''}`; },

            saveQuestionForm(event) {
                event.preventDefault();
                const text = document.getElementById('form-q-text').value;
                const type = document.getElementById('form-q-type').value;
                const isRecurring = document.querySelector('input[name="sched"]:checked').value === 'rec';
                const monthsSelect = document.getElementById('form-q-months');
                const yearsSelect = document.getElementById('form-q-years');
                const activeMonths = monthsSelect ? Array.from(monthsSelect.selectedOptions).map(o => o.value) : [];
                const activeYears = yearsSelect ? Array.from(yearsSelect.selectedOptions).map(o => o.value) : [];
                if (this.editingQuestionId === 'new') {
                    this.questions.push({ id: `q-${Math.random().toString(36).substr(2, 6)}`, text, type, isRecurring, activeMonths, activeYears, hidden: false });
                } else {
                    const q = this.questions.find(que => que.id === this.editingQuestionId);
                    if (q) Object.assign(q, { text, type, isRecurring, activeMonths, activeYears });
                }
                this.saveQuestions();
                this.editingQuestionId = null;
                this.updateUI();
            },

            toggleHide(qid) {
                const q = this.questions.find(que => que.id === qid);
                if (q) q.hidden = !q.hidden;
                this.saveQuestions();
                this.updateUI();
            },

            renderTrendChart() {
                const ctx = document.getElementById('trendChart')?.getContext('2d');
                if (!ctx) return;
                const t = translations[this.lang];
                const chartData = t.months.map((_, monthIdx) => {
                    const monthResponses = this.responses.filter(r => r.monthIndex === monthIdx && r.year === this.selectedYear);
                    let score = 0, count = 0;
                    monthResponses.forEach(r => {
                        r.answers.forEach(a => {
                            const q = this.questions.find(que => que.id === a.questionId);
                            if (q && q.type !== QuestionType.TEXT_FEEDBACK) {
                                const val = parseFloat(a.value);
                                if (!isNaN(val)) {
                                    const max = q.type === QuestionType.SATISFACTION_SCALE ? 5 : 10;
                                    score += (val / max) * 100;
                                    count++;
                                }
                            }
                        });
                    });
                    return count > 0 ? Math.round(score / count) : 0;
                });
                if (window.myTrendChart) window.myTrendChart.destroy();
                window.myTrendChart = new Chart(ctx, { type: 'line', data: { labels: t.shortMonths, datasets: [{ data: chartData, borderColor: '#facc15', backgroundColor: 'rgba(250, 204, 21, 0.1)', fill: true, tension: 0.4, borderWidth: 4, pointRadius: 4, pointBackgroundColor: '#facc15', pointBorderColor: '#ffffff' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, ticks: { font: { size: 9, weight: 'bold' }, callback: val => val + '%' }, grid: { color: 'rgba(0,0,0,0.05)' } }, x: { ticks: { font: { size: 9, weight: 'bold' } }, grid: { display: false } } } } });
            },

            async fetchCloudData() {
                if (!this.isAuthenticated) return;
                this.isSyncing = true; this.updateUI();
                try {
                    const response = await fetch(APPSCRIPT_URL);
                    const cloudResult = await response.json();
                    if (cloudResult.questions && cloudResult.questions.length > 0) {
                        this.questions = cloudResult.questions;
                        this.saveQuestions();
                    }
                    const rows = cloudResult.responses || [];
                    if (Array.isArray(rows) && rows.length > 0) {
                        const headers = rows[0];
                        this.responses = rows.slice(1).map((row, idx) => {
                            const periodStr = String(row[2] || "");
                            const parts = periodStr.split(' ');
                            return { id: `c-${idx}`, timestamp: row[0], employeeEmail: row[1], monthIndex: this.normalizeMonth(parts[0]), year: parts[1] || this.selectedYear, answers: this.questions.map(q => { const colIndex = headers.findIndex(h => h && h.toString().includes(`[ID:${q.id}]`)); return { questionId: q.id, value: colIndex > -1 ? row[colIndex] : '' }; }) };
                        });
                    }
                } catch (e) { console.error("Cloud Error:", e); } 
                finally { this.isSyncing = false; this.updateUI(); }
            },

            async syncSchema() {
                if (!this.isAuthenticated) return;
                this.isSyncing = true; this.updateUI();
                const payload = { action: 'sync_schema', questions: this.questions };
                try { 
                    await fetch(APPSCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) }); 
                    alert('Synchronisierung abgeschlossen. Die Survey-IDs sind nun mit dem Spreadsheet verknüpft.'); 
                    setTimeout(() => this.fetchCloudData(), 1500); 
                } catch (e) { console.error("Sync Error:", e); } 
                finally { this.isSyncing = false; this.updateUI(); }
            }
        };
        executiveApp.init();
    </script>
</body>
</html>
