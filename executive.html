<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZS - Vorstand - Mitarbeiter-Zufriedenheits-System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input:focus, select:focus, textarea:focus { border-color: #facc15 !important; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white font-black text-xs">MZS</div>
                <h1 id="nav-title" class="text-xl font-black bg-slate-900 bg-clip-text text-transparent uppercase tracking-tighter">MZS</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <nav class="hidden md:flex gap-1 bg-slate-100 p-1 rounded-xl">
                    <button onclick="window.location.href='index.html'" class="px-4 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-all text-slate-500 hover:text-slate-900" id="btn-nav-employee"></button>
                    <button onclick="window.location.href='executive.html'" class="px-4 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-all bg-white text-slate-900 shadow-sm" id="btn-nav-ceo"></button>
                </nav>
                <div class="flex items-center bg-slate-100 p-1 rounded-lg">
                    <button onclick="app.setLang('de')" id="lang-de" class="px-2 py-1 rounded text-[10px] font-black uppercase transition-all">DE</button>
                    <button onclick="app.setLang('en')" id="lang-en" class="px-2 py-1 rounded text-[10px] font-black uppercase transition-all">EN</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <div id="view-container" class="max-w-6xl mx-auto">
            <!-- Content injected via JS -->
        </div>
    </main>

    <script>
        const APPSCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhsBtLWsN4IOF21kXDQxyXmwuvcmfde5jmLxPp0PNxKIZ1D39orL35SKamh8q5RIo/exec';
        
        // IMPORTANT: Deploy your Auth Script as "Web App" and paste URL below
        const AUTH_APPSCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_PASTE_YOUR_AUTH_SCRIPT_ID_HERE/exec';
        
        const translations = {
            de: {
                title: 'MZS',
                survey: 'Check-In',
                dashboard: 'Vorstand',
                months: ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'],
                shortMonths: ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'],
                executivePulse: 'Vorstands-Impuls',
                opsIntelligence: 'Betriebs-Intelligenz',
                totalEntries: 'Gesamteinträge',
                viewActive: 'Gefiltert',
                fullYear: 'Ganzes Jahr',
                refresh: 'Aktualisieren',
                performanceOverTime: 'Leistung im Zeitverlauf',
                fieldIntelligence: 'Feld-Informationen',
                noActiveComments: 'Keine Kommentare vorhanden',
                metricInfra: 'Metrik-Management',
                addMetric: 'Neue Metrik',
                questionText: 'Anzeigetext',
                metricType: 'Typ',
                scheduleType: 'Zeitplan',
                recurring: 'Wiederkehrend',
                oneOff: 'Einmalig',
                deployMetric: 'Aktivieren',
                updateMetric: 'Aktualisieren',
                hideMetric: 'Ausblenden',
                systemCatalog: 'System-Katalog',
                loginTitle: 'Vorstands-Portal',
                loginSubtitle: 'Bitte identifizieren Sie sich, um auf sensible Daten zuzugreifen.',
                email: 'E-Mail Adresse',
                password: 'Passwort',
                loginBtn: 'Sicher Einloggen',
                logout: 'Abmelden',
                changePass: 'Passwort ändern',
                oldPass: 'Altes Passwort',
                newPass: 'Neues Passwort',
                save: 'Änderungen speichern',
                authError: 'Authentifizierungsfehler'
            },
            en: {
                title: 'MZS',
                survey: 'Check-In',
                dashboard: 'Executive',
                months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
                shortMonths: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                executivePulse: 'Executive Pulse',
                opsIntelligence: 'Ops Intelligence',
                totalEntries: 'Total Entries',
                viewActive: 'Filtered',
                fullYear: 'Full Year',
                refresh: 'Refresh',
                performanceOverTime: 'Performance Over Time',
                fieldIntelligence: 'Field Intelligence',
                noActiveComments: 'No active comments to display',
                metricInfra: 'Metric Management',
                addMetric: 'Add New Metric',
                questionText: 'Display Text',
                metricType: 'Type',
                scheduleType: 'Schedule',
                recurring: 'Recurring',
                oneOff: 'One-Off',
                deployMetric: 'Deploy',
                updateMetric: 'Update',
                hideMetric: 'Hide',
                systemCatalog: 'System Catalog',
                loginTitle: 'Executive Portal',
                loginSubtitle: 'Please identify yourself to access sensitive data.',
                email: 'Email Address',
                password: 'Password',
                loginBtn: 'Secure Login',
                logout: 'Logout',
                changePass: 'Change Password',
                oldPass: 'Old Password',
                newPass: 'New Password',
                save: 'Save Changes',
                authError: 'Authentication Error'
            }
        };

        const QuestionType = {
            SATISFACTION_SCALE: 'SATISFACTION_SCALE',
            PERFORMANCE_RATING: 'PERFORMANCE_RATING',
            TEXT_FEEDBACK: 'TEXT_FEEDBACK'
        };

        const app = {
            lang: localStorage.getItem('app_lang') || 'de',
            isSyncing: false,
            questions: [],
            responses: [],
            selectedMonth: 'All',
            selectedYear: new Date().getFullYear().toString(),
            editingQuestionId: null,
            isShowingSettings: false,
            auth: {
                isLoggedIn: sessionStorage.getItem('mzs_logged_in') === 'true',
                email: sessionStorage.getItem('mzs_user_email') || '',
                isAuthenticating: false
            },

            init() {
                this.loadQuestions();
                this.updateUI();
                if (this.auth.isLoggedIn) this.fetchCloudData();
            },

            loadQuestions() {
                const raw = localStorage.getItem('survey_questions');
                this.questions = raw ? JSON.parse(raw) : [];
            },

            saveQuestions() { localStorage.setItem('survey_questions', JSON.stringify(this.questions)); },

            setLang(lang) { this.lang = lang; localStorage.setItem('app_lang', lang); this.updateUI(); },

            updateUI() {
                const t = translations[this.lang];
                document.getElementById('nav-title').textContent = t.title;
                document.getElementById('btn-nav-employee').textContent = t.survey;
                document.getElementById('btn-nav-ceo').textContent = t.dashboard;

                document.getElementById('lang-de').className = `px-2 py-1 rounded text-[10px] font-black uppercase transition-all ${this.lang === 'de' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`;
                document.getElementById('lang-en').className = `px-2 py-1 rounded text-[10px] font-black uppercase transition-all ${this.lang === 'en' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`;

                const container = document.getElementById('view-container');
                if (!this.auth.isLoggedIn) {
                    this.renderLoginView(container, t);
                } else {
                    this.renderCEOView(container, t);
                }
            },

            renderLoginView(container, t) {
                container.innerHTML = `
                    <div class="bg-white p-8 md:p-14 rounded-[2.5rem] shadow-2xl max-w-lg mx-auto border-t-[12px] border-slate-900 animate-in">
                        <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center text-3xl mb-8">🔒</div>
                        <h2 class="text-3xl font-black text-slate-900 uppercase tracking-tighter leading-none mb-2">${t.loginTitle}</h2>
                        <p class="text-slate-400 font-bold text-xs mb-10">${t.loginSubtitle}</p>
                        <form onsubmit="app.handleLogin(event)" class="space-y-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">${t.email}</label>
                                <input type="email" id="login-email" required class="w-full px-5 py-4 rounded-xl border-2 border-slate-50 focus:border-yellow-400 outline-none font-bold text-slate-700 bg-slate-50 transition-all" />
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">${t.password}</label>
                                <input type="password" id="login-pass" required class="w-full px-5 py-4 rounded-xl border-2 border-slate-50 focus:border-yellow-400 outline-none font-bold text-slate-700 bg-slate-50 transition-all" />
                            </div>
                            <button type="submit" ${this.auth.isAuthenticating ? 'disabled' : ''} class="w-full bg-slate-900 text-white py-6 rounded-2xl font-black uppercase tracking-widest hover:bg-slate-800 shadow-xl transition-all disabled:opacity-50">
                                ${this.auth.isAuthenticating ? '...' : t.loginBtn}
                            </button>
                        </form>
                    </div>
                `;
            },

            renderCEOView(container, t) {
                const filtered = this.responses.filter(r => {
                    const matchesMonth = this.selectedMonth === 'All' || r.monthIndex === this.normalizeMonth(this.selectedMonth);
                    const matchesYear = r.year === this.selectedYear;
                    return matchesMonth && matchesYear;
                });

                container.innerHTML = `
                    <div class="space-y-8 pb-24 animate-in">
                        <!-- Top Header -->
                        <div class="bg-slate-900 p-8 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden">
                            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 relative z-10">
                                <div>
                                    <span class="text-[10px] font-black uppercase tracking-[0.3em] text-yellow-400 mb-2 block">${t.executivePulse}</span>
                                    <h2 class="text-3xl md:text-5xl font-black tracking-tighter uppercase leading-none">${t.opsIntelligence}</h2>
                                    <div class="flex items-center gap-6 mt-6">
                                        <div class="flex flex-col"><span class="text-2xl font-black">${this.responses.length}</span><span class="text-[8px] font-black uppercase text-slate-400">${t.totalEntries}</span></div>
                                        <div class="h-10 w-px bg-slate-700"></div>
                                        <div class="flex flex-col"><span class="text-2xl font-black text-emerald-400">${filtered.length}</span><span class="text-[8px] font-black uppercase text-slate-400">${t.viewActive}</span></div>
                                    </div>
                                </div>
                                <div class="flex flex-wrap gap-2 w-full lg:w-auto">
                                    <select onchange="app.selectedMonth = this.value; app.updateUI();" class="flex-grow bg-slate-800 px-5 py-3 rounded-xl border border-slate-700 text-xs font-black uppercase outline-none">
                                        <option value="All" ${this.selectedMonth === 'All' ? 'selected' : ''}>${t.fullYear}</option>
                                        ${t.months.map(m => `<option value="${m}" ${this.selectedMonth === m ? 'selected' : ''}>${m}</option>`).join('')}
                                    </select>
                                    <select onchange="app.selectedYear = this.value; app.updateUI();" class="flex-grow bg-slate-800 px-5 py-3 rounded-xl border border-slate-700 text-xs font-black uppercase outline-none">
                                        ${['2025', '2026', '2027', '2028', '2029', '2030'].map(y => `<option value="${y}" ${this.selectedYear === y ? 'selected' : ''}>${y}</option>`).join('')}
                                    </select>
                                    <button onclick="app.fetchCloudData()" class="bg-yellow-400 text-slate-900 px-8 py-3 rounded-xl text-xs font-black uppercase shadow-xl hover:bg-yellow-500 transition-all">
                                        ${this.isSyncing ? '...' : t.refresh}
                                    </button>
                                </div>
                            </div>
                            
                            <div class="mt-8 pt-6 border-t border-slate-800 flex justify-between items-center relative z-10">
                                <div class="flex items-center gap-3"><div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div><span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${this.auth.email}</span></div>
                                <div class="flex gap-4">
                                    <button onclick="app.isShowingSettings = true; app.updateUI();" class="text-[10px] font-black text-slate-500 hover:text-white uppercase tracking-widest transition-all">⚙ ${t.changePass}</button>
                                    <button onclick="app.logout()" class="text-[10px] font-black text-red-500 hover:text-red-400 uppercase tracking-widest transition-all">${t.logout}</button>
                                </div>
                            </div>
                        </div>

                        <!-- Main Charts Row -->
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2 bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 h-[400px]">
                                <h3 class="text-xs font-black uppercase tracking-widest text-slate-900 mb-6">${t.performanceOverTime}</h3>
                                <canvas id="trendChart"></canvas>
                            </div>
                            <div class="bg-slate-900 p-8 rounded-[2.5rem] text-white flex flex-col h-[400px]">
                                <h3 class="text-xs font-black uppercase tracking-[0.2em] text-yellow-400 mb-6">${t.fieldIntelligence}</h3>
                                <div class="space-y-4 overflow-y-auto pr-2 custom-scrollbar flex-grow">
                                    ${filtered.flatMap(r => r.answers.filter(a => {
                                        const q = this.questions.find(que => que.id === a.questionId);
                                        return q && q.type === QuestionType.TEXT_FEEDBACK && a.value;
                                    }).map(a => `<div class="border-l-2 border-yellow-400 pl-4 py-1"><p class="text-[9px] font-bold text-slate-500">${t.months[r.monthIndex]} ${r.year} • ${r.employeeEmail}</p><p class="text-xs italic">"${a.value}"</p></div>`)).join('') || `<p class="text-slate-500 italic text-xs">${t.noActiveComments}</p>`}
                                </div>
                            </div>
                        </div>

                        <!-- Data Cards -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${this.questions.filter(q => !q.hidden).map(q => {
                                const ans = filtered.flatMap(r => r.answers.filter(a => a.questionId === q.id));
                                if (q.type === QuestionType.TEXT_FEEDBACK) return '';
                                const max = q.type === QuestionType.SATISFACTION_SCALE ? 5 : 10;
                                const scores = ans.map(a => parseFloat(a.value)).filter(v => !isNaN(v));
                                const avg = scores.length > 0 ? (scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
                                const percent = (avg / max) * 100;
                                return `<div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between min-h-[180px]">
                                        <div class="flex justify-between items-start"><p class="text-[10px] font-black uppercase tracking-tight text-slate-900 max-w-[75%]">${q.text}</p><span class="bg-slate-50 text-[8px] font-black px-2 py-1 rounded">${scores.length}</span></div>
                                        <div>
                                            <div class="flex items-baseline gap-1 mb-2"><span class="text-3xl font-black ${percent > 75 ? 'text-emerald-500' : 'text-yellow-500'}">${avg.toFixed(1)}</span><span class="text-slate-300 text-xs font-bold">/${max}</span></div>
                                            <div class="w-full h-1 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-yellow-400 transition-all duration-700" style="width: ${percent}%"></div></div>
                                        </div>
                                    </div>`;
                            }).join('')}
                        </div>
                    </div>
                    ${this.isShowingSettings ? this.renderSettingsModal(t) : ''}
                `;
                this.renderTrendChart();
            },

            renderSettingsModal(t) {
                return `<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in">
                        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl relative">
                            <button onclick="app.isShowingSettings = false; app.updateUI();" class="absolute top-8 right-8 text-slate-300 hover:text-slate-900">✕</button>
                            <h3 class="text-2xl font-black text-slate-900 uppercase tracking-tighter mb-8">${t.changePass}</h3>
                            <form onsubmit="app.handlePasswordChange(event)" class="space-y-6">
                                <div class="space-y-2"><label class="text-[10px] font-black uppercase tracking-widest text-slate-400">${t.oldPass}</label><input type="password" id="old-pass" required class="w-full px-5 py-4 rounded-xl border-2 border-slate-50 focus:border-yellow-400 outline-none font-bold bg-slate-50" /></div>
                                <div class="space-y-2"><label class="text-[10px] font-black uppercase tracking-widest text-slate-400">${t.newPass}</label><input type="password" id="new-pass" required class="w-full px-5 py-4 rounded-xl border-2 border-slate-50 focus:border-yellow-400 outline-none font-bold bg-slate-50" /></div>
                                <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase tracking-widest hover:bg-slate-800 transition-all">${t.save}</button>
                            </form>
                        </div>
                    </div>`;
            },

            async handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-pass').value;
                if (AUTH_APPSCRIPT_URL.includes('PASTE_YOUR_AUTH_SCRIPT_ID_HERE')) { alert('Error: AUTH_APPSCRIPT_URL is not configured!'); return; }
                this.auth.isAuthenticating = true; this.updateUI();
                try {
                    const response = await fetch(AUTH_APPSCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', payload: { email, password } }) });
                    const result = await response.json();
                    if (result.success) {
                        this.auth.isLoggedIn = true; this.auth.email = result.user.email;
                        sessionStorage.setItem('mzs_logged_in', 'true'); sessionStorage.setItem('mzs_user_email', result.user.email);
                        this.fetchCloudData();
                    } else { alert(result.message || 'Login failed'); }
                } catch (err) { alert(`${translations[this.lang].authError}: ${err.message}`); }
                finally { this.auth.isAuthenticating = false; this.updateUI(); }
            },

            logout() { sessionStorage.removeItem('mzs_logged_in'); sessionStorage.removeItem('mzs_user_email'); window.location.reload(); },

            async handlePasswordChange(e) {
                e.preventDefault();
                const oldPassword = document.getElementById('old-pass').value;
                const newPassword = document.getElementById('new-pass').value;
                try {
                    const response = await fetch(AUTH_APPSCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'change_password', payload: { email: this.auth.email, oldPassword, newPassword } }) });
                    const result = await response.json();
                    if (result.success) { alert('Password updated'); this.isShowingSettings = false; this.updateUI(); } else { alert(result.message); }
                } catch (err) { alert('Error: ' + err.message); }
            },

            normalizeMonth(monthName) {
                const de = translations.de.months, en = translations.en.months;
                let idx = de.indexOf(monthName); if (idx === -1) idx = en.indexOf(monthName); return idx;
            },

            renderTrendChart() {
                const ctx = document.getElementById('trendChart')?.getContext('2d'); if (!ctx) return;
                const t = translations[this.lang];
                const chartData = t.months.map((_, monthIdx) => {
                    const monthResponses = this.responses.filter(r => r.monthIndex === monthIdx && r.year === this.selectedYear);
                    let score = 0, count = 0;
                    monthResponses.forEach(r => {
                        r.answers.forEach(a => {
                            const q = this.questions.find(que => que.id === a.questionId);
                            if (q && q.type !== QuestionType.TEXT_FEEDBACK) {
                                const val = parseFloat(a.value), max = q.type === QuestionType.SATISFACTION_SCALE ? 5 : 10;
                                if (!isNaN(val)) { score += (val / max) * 100; count++; }
                            }
                        });
                    });
                    return count > 0 ? Math.round(score / count) : 0;
                });
                if (window.myTrendChart) window.myTrendChart.destroy();
                window.myTrendChart = new Chart(ctx, { type: 'line', data: { labels: t.shortMonths, datasets: [{ data: chartData, borderColor: '#facc15', backgroundColor: 'rgba(250, 204, 21, 0.1)', fill: true, tension: 0.4, borderWidth: 4, pointRadius: 4, pointBackgroundColor: '#facc15', pointBorderColor: '#ffffff' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 }, x: { grid: { display: false } } } } });
            },

            async fetchCloudData() {
                this.isSyncing = true; this.updateUI();
                try {
                    const response = await fetch(APPSCRIPT_URL);
                    const rows = await response.json();
                    if (Array.isArray(rows) && rows.length > 0) {
                        const headers = rows[0];
                        this.responses = rows.slice(1).map((row, idx) => {
                            const periodStr = String(row[2] || ""), parts = periodStr.split(' ');
                            return { id: `c-${idx}`, monthIndex: this.normalizeMonth(parts[0]), year: parts[1] || this.selectedYear, employeeEmail: row[1], answers: this.questions.map(q => {
                                const colIndex = headers.findIndex(h => h && h.toString().includes(`[ID:${q.id}]`));
                                return { questionId: q.id, value: colIndex > -1 ? row[colIndex] : '' };
                            }) };
                        });
                    }
                } catch (e) { console.error(e); } finally { this.isSyncing = false; this.updateUI(); }
            }
        };
        app.init();
    </script>
</body>
</html>
